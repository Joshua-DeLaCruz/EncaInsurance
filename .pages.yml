            type: object
            list: true
            fields:
              - name: value
                label: "Value (do not translate)"
                type: string
              - name: label
                label: "Date as shown"
                type: string
          - name: consent
            label: "Consent"
            type: text
          - name: submit
            label: "Submit"
            type: string
          - name: sending
            label: "Sending"
            type: string
          - name: success
            label: "Success"
            type: string
          - name: error
            label: "Error"
            type: string
          - name: mailto_note
            label: "Note when email app opens"
            type: text
      - name: contact
        label: "Contact section"
        type: object
        fields:
          - name: title
            label: "Title"
            type: string
          - name: phone
            label: "Phone"
            type: string
          - name: whatsapp
            label: "Whatsapp"
            type: string
          - name: whatsapp_text
            label: "WhatsApp link text"
            type: string
          - name: whatsapp_prefill
            label: "WhatsApp starting message"
            type: string
          - name: email
            label: "Email"
            type: string
          - name: address
            label: "Address"
            type: string
          - name: directions
            label: "Directions"
            type: string
          - name: hours_title
            label: "Hours heading"
            type: string
          - name: hours
            label: "Opening hours"
            type: object
            list: true
            fields:
              - name: days
                label: "Days"
                type: string
              - name: time
                label: "Time"
                type: string
          - name: map_title
            label: "Map description"
            type: string
      - name: footer
        label: "Footer"
        type: object
        fields:
          - name: tagline
            label: "Tagline"
            type: string
          - name: license_label
            label: "License label"
            type: string
          - name: agent_label
            label: "Agent in charge label"
            type: string
          - name: disclaimer
            label: "Disclaimer"
            type: text
          - name: privacy
            label: "Privacy policy page"
            type: string
          - name: rights
            label: "Rights"
            type: string
          - name: follow
            label: "Follow"
            type: string
      - name: mobile_bar
        label: "Phone buttons (mobile)"
        type: object
        fields:
          - name: call
            label: "Call"
            type: string
          - name: quote
            label: "Quote form"
            type: string
      - name: privacy
