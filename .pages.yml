          - name: image_alt
            label: "Photo description (for screen readers)"
            type: string
      - name: quote
        label: "Quote form"
        type: object
        fields:
          - name: title
            label: "Title"
            type: string
          - name: text
            label: "Text"
            type: text
          - name: name
            label: "Name"
            type: string
          - name: phone
            label: "Phone"
            type: string
          - name: email
            label: "Email"
            type: string
          - name: type
            label: "Type"
            type: string
          - name: language
            label: "Language"
            type: string
          - name: message
            label: "Message"
            type: string
          - name: message_hint
